<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Images</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 24px;
        }

        a {
            text-decoration: none;
            color: #0366d6;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        li:hover {
            background: #f5f5f5;
        }

        .folder::before {
            content: "📁 ";
        }

        .image::before {
            content: "🖼️ ";
        }

        .video::before {
            content: "🎬 ";
        }

        .file::before {
            content: "📄 ";
        }

        .parent::before {
            content: "⬅️ ";
        }
    </style>
</head>

<body>

<h1 id="title">Images</h1>

<ul id="file-list">
    <li>Chargement...</li>
</ul>

<script>

const owner = "louis-chevallier";
const repo = "louis-chevallier.github.io";


// Le chemin courant dans le dépôt
let path = "images";


// ------------------------------------------------------------
// Obtient le chemin demandé dans l'URL
// ------------------------------------------------------------

const urlPath = decodeURIComponent(
    window.location.pathname
);

const marker = "/images";

if (urlPath.startsWith(marker)) {
    let p = urlPath.substring(marker.length);

    if (p.startsWith("/"))
        p = p.substring(1);

    if (p)
        path = "images/" + p;
}


// ------------------------------------------------------------
// Affichage
// ------------------------------------------------------------

document.getElementById("title").textContent =
    path;


// ------------------------------------------------------------
// Icône selon le type de fichier
// ------------------------------------------------------------

function fileClass(name) {

    const ext = name
        .split(".")
        .pop()
        .toLowerCase();

    if ([
        "jpg", "jpeg", "png", "gif",
        "webp", "bmp", "svg"
    ].includes(ext))
        return "image";

    if ([
        "mp4", "webm", "mov", "avi",
        "mkv", "m4v"
    ].includes(ext))
        return "video";

    return "file";
}


// ------------------------------------------------------------
// Charge le contenu du dossier GitHub
// ------------------------------------------------------------

async function loadDirectory() {

    const url =
        `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `Erreur GitHub : ${response.status}`
        );
    }

    const files = await response.json();

    const list =
        document.getElementById("file-list");

    list.innerHTML = "";


    // --------------------------------------------------------
    // Lien vers le dossier parent
    // --------------------------------------------------------

    if (path !== "images") {

        const parentPath =
            path.substring(0, path.lastIndexOf("/"));

        const li = document.createElement("li");

        li.className = "parent";

        const a = document.createElement("a");

        a.textContent = "..";

        a.href =
            "/images/" +
            (
                parentPath === "images"
                    ? ""
                    : parentPath.substring("images/".length) + "/"
            );

        li.appendChild(a);

        list.appendChild(li);
    }


    // --------------------------------------------------------
    // Tri : dossiers puis fichiers
    // --------------------------------------------------------

    files.sort((a, b) => {

        if (a.type !== b.type)
            return a.type === "dir" ? -1 : 1;

        return a.name.localeCompare(
            b.name,
            undefined,
            { numeric: true }
        );
    });


    // --------------------------------------------------------
    // Création des liens
    // --------------------------------------------------------

    for (const file of files) {

        const li =
            document.createElement("li");

        if (file.type === "dir") {

            li.className = "folder";

            const a =
                document.createElement("a");

            a.textContent = file.name;

            const relativePath =
                path.substring("images".length);

            a.href =
                "/images/" +
                (
                    relativePath
                        ? relativePath.substring(1) + "/"
                        : ""
                ) +
                file.name +
                "/";

            li.appendChild(a);

        } else {

            li.className =
                fileClass(file.name);

            const a =
                document.createElement("a");

            a.textContent = file.name;

            /*
             * GitHub Pages sert directement le fichier.
             */
            const relativePath =
                path.substring("images".length);

            a.href =
                "/images/" +
                (
                    relativePath
                        ? relativePath.substring(1) + "/"
                        : ""
                ) +
                file.name;

            a.target = "_blank";

            li.appendChild(a);
        }

        list.appendChild(li);
    }
}


// ------------------------------------------------------------
// Lancement
// ------------------------------------------------------------

loadDirectory().catch(error => {

    document.getElementById("file-list").innerHTML =
        `<li>Erreur : ${error.message}</li>`;

});

</script>

</body>
</html>
